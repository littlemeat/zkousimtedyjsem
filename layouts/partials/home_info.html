{{- /* Hero úvodní stránky: zatím jen titulek a dvě věty.
       Blok s rubrikami jsme zkusili a Marie ho nechtěla — viz historie. */ -}}
{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info">
    {{- with .Portrait }}
    <img class="home-portrait" src="{{ . | absURL }}" alt="{{ site.Params.author | default site.Title }}"
         width="64" height="64" loading="eager">
    {{- end }}
    <header class="entry-header">
        <h1>{{ .Title | markdownify }}</h1>
    </header>
    <div class="entry-content">
        {{ .Content | markdownify }}
    </div>
</article>
{{- end }}
