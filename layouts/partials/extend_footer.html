{{- /* Hlavička se při rolování dolů skryje a při rolování nahoru se vrátí.
       Na čtecím webu tím článek nepřijde o šířku ani výšku, ale navigace je
       pořád na jedno gesto. Kdo má vypnuté animace, dostane jen přilepenou lištu. */ -}}
<script>
(function () {
  var header = document.querySelector('.header');
  if (!header) return;

  var tichyRezim = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var posledni = window.scrollY;
  var obratNa = window.scrollY;   // odkud měříme souvislý pohyb jedním směrem
  var ceka = false;
  var smerDolu = true;

  function prekresli() {
    var y = window.scrollY;

    header.classList.toggle('header--compact', y > 8);

    if (!tichyRezim) {
      var dolu = y > posledni;
      if (dolu !== smerDolu) {
        smerDolu = dolu;
        obratNa = y;   // změna směru, začínáme měřit znovu
      }
      var ujeto = Math.abs(y - obratNa);

      // Práh musí být nízký, jinak na krátkých stránkách (úvod) lišta zůstane
      // viset přes nadpis. Zpátky se ale vrací až po souvislém pohybu nahoru,
      // aby nenaskočila přes text, když si čtenář odroluje o větu zpět.
      if (dolu && y > 40) {
        header.classList.add('header--skryta');
      } else if (!dolu && (ujeto > 50 || y < 40)) {
        header.classList.remove('header--skryta');
      }
    }

    posledni = y;
    ceka = false;
  }

  window.addEventListener('scroll', function () {
    if (!ceka) {
      ceka = true;
      window.requestAnimationFrame(prekresli);
    }
  }, { passive: true });

  prekresli();
})();
</script>
