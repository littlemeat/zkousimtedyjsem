name: Publikovat blog z Notionu

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-and-build:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image support
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Check Notion token
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          test -n "$NOTION_TOKEN" || {
            echo "Chybí GitHub Secret NOTION_TOKEN." >&2
            exit 1
          }

      - name: Convert articles ready for publication
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/notion-blog.py publish-ready --output "$RUNNER_TEMP/published-articles.json"

      - name: Test converter
        run: python3 scripts/notion-blog.py selftest

      - name: Install Hugo CLI
        env:
          HUGO_VERSION: 0.158.0
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Build Hugo site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Prague
        run: hugo --gc --minify

      - name: Commit converted articles
        id: commit
        run: |
          git add content .notion-blog.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Žádný článek ve stavu K publikaci."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish blog articles from Notion"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Upload site artifact
        if: steps.commit.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Upload publication manifest
        if: steps.commit.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: published-articles
          path: ${{ runner.temp }}/published-articles.json
          retention-days: 1

  deploy:
    needs: publish-and-build
    if: needs.publish-and-build.outputs.published == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  mark-published:
    needs: [publish-and-build, deploy]
    if: needs.publish-and-build.outputs.published == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download publication manifest
        uses: actions/download-artifact@v4
        with:
          name: published-articles
          path: ${{ runner.temp }}

      - name: Mark articles as published in Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/notion-blog.py mark-published "$RUNNER_TEMP/published-articles.json"
