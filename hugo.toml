baseURL = "https://zkousimtedyjsem.cz/"
languageCode = "cs"
title = "Zkouším, tedy jsem"
theme = "PaperMod"
timeZone = "Europe/Prague"
titleCaseStyle = "none"  # nepřepisovat štítky na Velká Písmena

[params]
  env = "production"
  description = "Osobní blog Marie — na čem pracuju, co testuju a kam cestuju. Zkouším, tedy jsem."
  DateFormat = "2. 1. 2006"
  mainSections = ["posts"]
  ShowReadingTime = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowToc = false
  defaultTheme = "light"
  disableThemeToggle = true
  disableScrollToTop = true   # šipka nahoru se na stránku nehodila

  [params.homeInfoParams]
    # TODO Marie: titulek si přepiš vlastními slovy.
    Title = "Zkouším věci na vlastní kůži a píšu, jak to dopadlo."
    Content = "Ahoj, jsem Marie. Píšu si tady o tom, na čem pracuju, co testuju a kam cestuju — od kódu přes šití a doplňky stravy až po výlety."
    # Portrét: dej fotku do static/img/ a odkomentuj (kolečko 64 px nad titulkem).
    # Portrait = "/img/marie.jpg"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  [params.label]
    text = "Zkouším, tedy jsem"

[[menu.main]]
  identifier = "uvod"
  name = "Úvod"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "clanky"
  name = "Články"
  url = "/posts/"
  weight = 20

