baseURL = "https://zkousimtedyjsem.cz/"
languageCode = "cs"
title = "Zkouším, tedy jsem"
theme = "PaperMod"

[params]
  env = "production"
  description = "Nezávislé srovnání doplňků stravy. Zkoušíme, testujeme a srovnáváme — abyste nemuseli."
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowShareButtons = false
  ShowToc = true
  TocOpen = true
  defaultTheme = "auto"

  [params.homeInfoParams]
    Title = "Zkouším, tedy jsem"
    Content = "Nezávislé srovnání doplňků stravy. Zkoušíme, testujeme a srovnáváme — abyste nemuseli."

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  [params.footer]
    text = "Tento web obsahuje affiliate odkazy."

  [params.label]
    text = "Zkouším, tedy jsem"

[[menu.main]]
  identifier = "uvod"
  name = "Úvod"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "srovnani"
  name = "Srovnání"
  url = "/srovnani/"
  weight = 20

[[menu.main]]
  identifier = "o-webu"
  name = "O webu"
  url = "/o-webu/"
  weight = 30

[[menu.main]]
  identifier = "affiliate-prohlaseni"
  name = "Affiliate prohlášení"
  url = "/affiliate-prohlaseni/"
  weight = 40

[[menu.main]]
  identifier = "search"
  name = "Hledat"
  url = "/search/"
  weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
