[[menu.main]]
  identifier = "o-mne"
  name = "O mně"
  url = "/o-mne/"
  weight = 60

# [[menu.main]]
#   identifier = "search"
#   name = "Hledat"
#   url = "/search/"
#   weight = 70

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  # Barevné zvýrazňování syntaxe bylo na krémovém webu nejkřiklavější prvek.
  # „bw“ je monochromní (rozlišuje jen tučností a kurzívou), pozadí řešíme v CSS.
  [markup.highlight]
    style = "bw"
    noClasses = true
    tabWidth = 2
